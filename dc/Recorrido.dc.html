<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Recorrido jugable</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0a0a07}
.stage:focus{outline:none}
.bg{image-rendering:pixelated}
.spr{position:absolute;width:48px;height:80px;background-image:url(assets/img/sprites.png);background-size:288px 1840px;background-repeat:no-repeat;image-rendering:pixelated;transform-origin:50% 100%}
.shadow{position:absolute;height:8px;border-radius:50%;background:rgba(10,10,6,.34)}
.restart{all:unset;cursor:pointer;box-sizing:border-box;padding:10px 16px;min-height:44px;display:flex;align-items:center;gap:10px;background:#14150f;box-shadow:3px 0 0 0 #3b3d2c,-3px 0 0 0 #3b3d2c,0 3px 0 0 #3b3d2c,0 -3px 0 0 #3b3d2c;font-family:'Silkscreen',monospace;font-size:12px;color:#e6dfc0}
.restart:hover,.restart:focus-visible{box-shadow:3px 0 0 0 #e8b33a,-3px 0 0 0 #e8b33a,0 3px 0 0 #e8b33a,0 -3px 0 0 #e8b33a}
.pulse{position:absolute;border-radius:50%;border:2px solid #e8b33a;box-sizing:border-box;animation:pulse 1.6s infinite ease-out;pointer-events:none}
@keyframes pulse{0%{transform:scale(.25);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.float{animation:float 2.2s infinite ease-in-out}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.blink{animation:blink 1s infinite steps(1)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.note{position:absolute;animation:note 2.4s infinite ease-out;pointer-events:none}
@keyframes note{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(14px,-56px);opacity:0}}
.vhs{background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 2px,transparent 2px 6px);animation:vhs .2s infinite steps(2)}
@keyframes vhs{0%{background-position:0 0}100%{background-position:0 6px}}
.buzz{animation:buzz .09s infinite steps(2)}
@keyframes buzz{0%{transform:translate(-4px,1px) rotate(-2deg)}100%{transform:translate(4px,-1px) rotate(2deg)}}
.pop{animation:pop .22s cubic-bezier(.2,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.alarm{animation:alarm .5s infinite steps(1)}
@keyframes alarm{0%{box-shadow:0 0 0 6px #e05a4a,0 0 0 10px #070705,0 0 60px rgba(224,90,74,.9)}50%{box-shadow:0 0 0 6px #f4f0dc,0 0 0 10px #070705,0 0 20px rgba(224,90,74,.4)}}
.redpulse{animation:redpulse .5s infinite steps(2)}
@keyframes redpulse{0%{opacity:.75}100%{opacity:.25}}
.fadein{animation:fadein .6s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.scan{background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 1px,transparent 1px 3px);pointer-events:none}
.layer{position:absolute;top:0;width:1280px;height:720px;image-rendering:pixelated;pointer-events:none}
.glow{mix-blend-mode:screen;animation:hum 7s infinite steps(1)}
@keyframes hum{0%,100%{opacity:.55}31%{opacity:.48}32%{opacity:.58}64%{opacity:.52}65%{opacity:.56}}
.hud{background:linear-gradient(180deg,rgba(28,29,24,.94),rgba(12,13,10,.94));box-shadow:inset 0 0 0 2px #3b3d2c,inset 0 3px 0 0 #55574a,0 6px 18px rgba(0,0,0,.45);clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px)}
.tag{position:absolute;min-width:22px;height:22px;padding:0 3px;box-sizing:border-box;background:#14150f;box-shadow:0 0 0 2px #070705,0 0 0 3px #55574a;display:flex;align-items:center;justify-content:center;font-family:'Silkscreen',monospace;font-weight:700;font-size:11px;line-height:1;color:#e6dfc0;pointer-events:none;animation:tagin .16s ease-out;white-space:nowrap}
@keyframes tagin{from{transform:translateY(6px) scale(.5);opacity:0}to{transform:none;opacity:1}}
.grr{background:#3a0f0b;box-shadow:0 0 0 2px #070705,0 0 0 3px #e05a4a;animation:grr .1s infinite steps(2)}
@keyframes grr{0%{transform:translate(-1px,0) rotate(-4deg)}100%{transform:translate(1px,-1px) rotate(4deg)}}
.shk{animation:shk .1s infinite steps(2)}
@keyframes shk{0%{transform:translate(-2px,0)}100%{transform:translate(2px,-1px)}}
.beat{animation:beat .5s infinite ease-out}
@keyframes beat{0%{transform:scale(1.12)}100%{transform:scale(1)}}
.chl{animation:chl .5s infinite steps(1)}
@keyframes chl{0%{opacity:1}50%{opacity:.2}}
.chr{animation:chr .5s infinite steps(1)}
@keyframes chr{0%{opacity:.2}50%{opacity:1}}
.puddle{position:absolute;border-radius:50%;background:radial-gradient(ellipse at 40% 40%,rgba(220,240,255,.55),rgba(140,180,210,.32) 45%,rgba(90,130,160,.18) 70%,rgba(90,130,160,0) 72%);pointer-events:none}
.tape{background:repeating-linear-gradient(135deg,#f2c200 0 14px,#10110c 14px 28px)}
.seg{position:absolute;height:8px;transform-origin:0 50%;border-radius:4px}
</style>
</helmet>
<div class="stage" tabIndex="0" ref="{{stageRef}}" onKeyDown="{{keyDown}}" onKeyUp="{{keyUp}}" onPointerDown="{{pointerDown}}" onPointerMove="{{pointerMove}}" onPointerUp="{{pointerUp}}" onPointerLeave="{{pointerUp}}" aria-label="Recorrido jugable: flechas o clic para caminar, espacio o clic sostenido para actuar" style="width: 1280px; height: 720px; position: relative; overflow: hidden; font-family: 'VT323', monospace; color: #e6dfc0; background: #0a0a07; cursor: {{cursor}}">

<!-- El mundo: un solo recorrido de la A a la H. La cámara sigue al personaje -->
<div style="position: absolute; left: 0; top: 0; width: 8960px; height: 720px; transform-origin: 0 0; transform: translate({{wx}}, {{wy}}) scale({{zoom}}); filter: {{worldFilter}}">
<sc-for list="{{bgs}}" as="b" hint-placeholder-count="2">
<img class="bg" src="{{b.src}}" alt="{{b.alt}}" style="position: absolute; left: {{b.l}}; top: 0; width: 1280px; height: 720px">
</sc-for>
<sc-if value="{{showTrain}}" hint-placeholder-val="{{ false }}"><img class="layer" src="assets/img/tren-a.png" alt="Tren de la línea A que se va" style="left: {{trainX}}"></sc-if>

<!-- Ascensor fuera de servicio -->
<div class="tape" style="position: absolute; left: 6194px; top: 236px; width: 236px; height: 14px; opacity: .9"></div>
<div class="tape" style="position: absolute; left: 6194px; top: 168px; width: 236px; height: 14px; opacity: .9"></div>
<img src="assets/img/fuera-de-servicio.png" alt="Ascensor fuera de servicio" style="position: absolute; left: 6252px; top: 184px; width: 120px; height: 52px; image-rendering: pixelated">
<!-- Botón de emergencia en la pared -->
<div style="position: absolute; left: {{sosL}}; top: 226px; width: 28px; height: 36px; {{sosFx}}">
<img src="assets/img/sos.png" alt="Botón de emergencia" style="width: 28px; height: 36px; image-rendering: pixelated; display: block">
</div>

<!-- Piso mojado -->
<sc-for list="{{puddles}}" as="pd" hint-placeholder-count="0">
<div class="puddle" style="left: {{pd.l}}; top: {{pd.t}}; width: {{pd.w}}; height: {{pd.h}}; opacity: {{pd.o}}"></div>
</sc-for>

<!-- Luz sobre quien necesita algo -->
<sc-if value="{{showSpot}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: {{spotL}}; top: {{spotT}}; width: 220px; height: 110px; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(255,214,120,.40) 0%, rgba(255,200,90,.14) 45%, rgba(255,200,90,0) 72%); opacity: {{spotOp}}; mix-blend-mode: screen; pointer-events: none"></div>
</sc-if>

<!-- Molinetes: brazos y lectores -->
<sc-for list="{{gates}}" as="gt" hint-placeholder-count="3">
<div style="position: absolute; left: {{gt.rl}}; top: {{gt.rt}}; width: 20px; height: 5px; background: {{gt.c}}; box-shadow: 0 0 10px {{gt.c}}; z-index: {{gt.z}}"></div>
<sc-if value="{{gt.closed}}" hint-placeholder-val="{{ true }}"><div style="position: absolute; left: {{gt.al}}; top: {{gt.at}}; width: 60px; height: 6px; background: #b8bab4; box-shadow: 0 0 0 2px #070705; z-index: {{gt.z}}"></div></sc-if>
<sc-if value="{{gt.broken}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; left: {{gt.xl}}; top: {{gt.xt}}; width: 20px; height: 20px; background: #e05a4a; box-shadow: 0 0 0 2px #070705; display: flex; align-items: center; justify-content: center; font-family: 'Silkscreen', monospace; font-weight: 700; font-size: 12px; color: #10110c; z-index: {{gt.z}}">X</div></sc-if>
</sc-for>

<!-- Objetos del piso (ordenados por profundidad con la gente) -->
<sc-for list="{{props}}" as="o" hint-placeholder-count="0">
<img src="{{o.src}}" alt="{{o.alt}}" style="position: absolute; left: {{o.l}}; top: {{o.t}}; width: {{o.w}}; height: {{o.h}}; z-index: {{o.z}}; image-rendering: pixelated; transform-origin: 50% 100%; transform: {{o.tr}}; filter: {{o.f}}">
</sc-for>

<!-- Documento pateado por el piso -->
<sc-if value="{{showDni}}" hint-placeholder-val="{{ false }}">
<svg role="img" aria-label="Documento en el piso" style="position: absolute; left: {{dniL}}; top: {{dniT}}; transform: rotate({{dniRot}}); z-index: 2" width="28" height="20" viewBox="0 0 14 10" shape-rendering="crispEdges"><rect x="0" y="0" width="14" height="10" fill="#14130f"></rect><rect x="1" y="1" width="12" height="8" fill="#d8d0b0"></rect><rect x="2" y="2" width="3" height="5" fill="#7d7a62"></rect><rect x="7" y="3" width="5" height="1" fill="#7d7a62"></rect><rect x="7" y="6" width="4" height="1" fill="#7d7a62"></rect></svg>
</sc-if>
<!-- Estuche del artista -->
<svg aria-hidden="true" style="position: absolute; left: 3178px; top: 318px; z-index: 318" width="40" height="20" viewBox="0 0 10 5" shape-rendering="crispEdges"><rect x="0" y="1" width="10" height="4" fill="#14130f"></rect><rect x="1" y="2" width="8" height="2" fill="#5a2420"></rect><sc-if value="{{coinInCase}}" hint-placeholder-val="{{ false }}"><rect x="4" y="2" width="2" height="1" fill="#e8b33a"></rect></sc-if></svg>
<sc-if value="{{showNotes}}" hint-placeholder-val="{{ false }}">
<sc-for list="{{notes}}" as="n" hint-placeholder-count="3">
<div class="note" style="left: {{n.l}}; top: {{n.t}}; animation-delay: {{n.d}}; z-index: 900"><svg width="16" height="16" viewBox="0 0 6 6" aria-hidden="true" shape-rendering="crispEdges"><rect x="3" y="0" width="1" height="4" fill="{{noteColor}}"></rect><rect x="4" y="0" width="2" height="1" fill="{{noteColor}}"></rect><rect x="1" y="3" width="3" height="2" fill="{{noteColor}}"></rect></svg></div>
</sc-for>
</sc-if>
<!-- Café que le dejaste a quien duerme -->
<sc-if value="{{showCup}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" style="position: absolute; left: 1556px; top: 330px; z-index: 341" width="16" height="20" viewBox="0 0 4 5" shape-rendering="crispEdges"><rect x="0" y="0" width="4" height="1" fill="#f4f0dc"></rect><rect x="0" y="1" width="4" height="4" fill="#c9a26a"></rect><rect x="0" y="2" width="4" height="1" fill="#7a5a3a"></rect></svg>
</sc-if>

<!-- Pulso de "alguien te necesita" -->
<sc-if value="{{showPulse}}" hint-placeholder-val="{{ false }}">
<div class="pulse" style="left: {{pulseL}}; top: {{pulseT}}; width: 90px; height: 90px; opacity: {{pulseOp}}"></div>
<div class="pulse" style="left: {{pulseL}}; top: {{pulseT}}; width: 90px; height: 90px; animation-delay: .8s; opacity: {{pulseOp}}"></div>
</sc-if>

<!-- Gente -->
<sc-for list="{{actors}}" as="p" hint-placeholder-count="10">
<div class="shadow" style="left: {{p.sl}}; top: {{p.st}}; width: {{p.sw}}; z-index: {{p.z}}"></div>
<div class="spr" role="img" aria-label="{{p.label}}" style="left: {{p.l}}; top: {{p.t}}; z-index: {{p.z}}; background-position: {{p.bp}}; transform: {{p.tr}}; filter: {{p.filter}}"></div>
</sc-for>

<!-- Destino del clic -->
<sc-if value="{{wtOn}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: {{wtL}}; top: {{wtT}}; width: 20px; height: 8px; border-radius: 50%; border: 2px solid rgba(240,236,220,.7); pointer-events: none"></div>
</sc-if>

<!-- Personaje -->
<div style="position: absolute; left: {{prl}}; top: {{prt}}; width: 46px; height: 14px; border-radius: 50%; border: 2px solid rgba(240,236,220,.5); box-sizing: border-box; z-index: {{pz}}; pointer-events: none"></div>
<div class="shadow" style="left: {{psl}}; top: {{pst}}; width: 34px; z-index: {{pz}}"></div>
<div class="spr" role="img" aria-label="Tu personaje" style="left: {{pl}}; top: {{pt}}; z-index: {{pz}}; background-position: {{pbp}}; transform: {{ptr}}"></div>
<sc-if value="{{carryDni}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" style="position: absolute; left: {{cdL}}; top: {{cdT}}; z-index: {{pz}}" width="18" height="13" viewBox="0 0 14 10" shape-rendering="crispEdges"><rect x="0" y="0" width="14" height="10" fill="#14130f"></rect><rect x="1" y="1" width="12" height="8" fill="#d8d0b0"></rect><rect x="2" y="2" width="3" height="5" fill="#7d7a62"></rect></svg></sc-if>
<sc-if value="{{showMe}}" hint-placeholder-val="{{ true }}">
<div class="float" style="position: absolute; left: {{meL}}; top: {{meT}}; z-index: 945; pointer-events: none"><svg role="img" aria-label="Este sos vos" width="20" height="14" viewBox="0 0 10 7" shape-rendering="crispEdges"><rect x="0" y="0" width="10" height="2" fill="#14130f"></rect><rect x="1" y="2" width="8" height="2" fill="#14130f"></rect><rect x="3" y="4" width="4" height="2" fill="#14130f"></rect><rect x="1" y="0" width="8" height="1" fill="#f0ecdc"></rect><rect x="2" y="1" width="6" height="2" fill="#f0ecdc"></rect><rect x="4" y="3" width="2" height="2" fill="#f0ecdc"></rect></svg></div>
</sc-if>

<!-- Globitos: lo que hace y siente la gente -->
<sc-for list="{{tags}}" as="tg" hint-placeholder-count="0">
<div class="{{tg.cls}}" style="left: {{tg.l}}; top: {{tg.t}}; z-index: 941; color: {{tg.color}}">
<sc-if value="{{tg.isTxt}}" hint-placeholder-val="{{ true }}"><span>{{tg.txt}}</span></sc-if>
<sc-if value="{{tg.heart}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 10 10" aria-hidden="true" shape-rendering="crispEdges"><rect x="1" y="2" width="3" height="1" fill="#e05a4a"></rect><rect x="6" y="2" width="3" height="1" fill="#e05a4a"></rect><rect x="0" y="3" width="10" height="3" fill="#e05a4a"></rect><rect x="1" y="6" width="8" height="1" fill="#e05a4a"></rect><rect x="2" y="7" width="6" height="1" fill="#e05a4a"></rect><rect x="3" y="8" width="4" height="1" fill="#e05a4a"></rect><rect x="4" y="9" width="2" height="1" fill="#e05a4a"></rect></svg></sc-if>
<sc-if value="{{tg.card}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 12 12" aria-hidden="true" shape-rendering="crispEdges"><rect x="1" y="3" width="10" height="7" fill="#2f7d6d"></rect><rect x="1" y="7" width="10" height="1" fill="#e8b33a"></rect><rect x="2" y="4" width="2" height="2" fill="#d8c27a"></rect></svg></sc-if>
<sc-if value="{{tg.note}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 12 12" aria-hidden="true" shape-rendering="crispEdges"><rect x="4" y="1" width="6" height="2" fill="#c9d97a"></rect><rect x="4" y="3" width="1" height="5" fill="#c9d97a"></rect><rect x="9" y="3" width="1" height="4" fill="#c9d97a"></rect><rect x="2" y="7" width="3" height="3" fill="#c9d97a"></rect><rect x="7" y="6" width="3" height="3" fill="#c9d97a"></rect></svg></sc-if>
<sc-if value="{{tg.coin}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 12 12" aria-hidden="true" shape-rendering="crispEdges"><rect x="2" y="2" width="8" height="8" fill="#e8b33a"></rect><rect x="5" y="4" width="2" height="4" fill="#b88a20"></rect></svg></sc-if>
<sc-if value="{{tg.rec}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 10 10" aria-hidden="true" shape-rendering="crispEdges"><rect x="1" y="2" width="8" height="6" fill="#bdb795"></rect><rect x="3" y="3" width="4" height="4" fill="#e05a4a"></rect></svg></sc-if>
<sc-if value="{{tg.tear}}" hint-placeholder-val="{{ false }}"><svg width="10" height="14" viewBox="0 0 5 7" aria-hidden="true" shape-rendering="crispEdges"><rect x="2" y="0" width="1" height="2" fill="#8ec8f0"></rect><rect x="1" y="2" width="3" height="3" fill="#8ec8f0"></rect><rect x="2" y="5" width="1" height="1" fill="#8ec8f0"></rect></svg></sc-if>
</div>
</sc-for>

<!-- Primer plano y luces de cada tramo -->
<sc-for list="{{fgs}}" as="f" hint-placeholder-count="0"><img class="layer" src="{{f.src}}" alt="" aria-hidden="true" style="left: {{f.l}}; z-index: 925"></sc-for>
<sc-for list="{{glows}}" as="gw" hint-placeholder-count="1"><img class="layer glow" src="{{gw.src}}" alt="" aria-hidden="true" style="left: {{gw.l}}; z-index: 926"></sc-for>

<!-- Partículas -->
<sc-for list="{{parts}}" as="q" hint-placeholder-count="0">
<div style="position: absolute; left: {{q.l}}; top: {{q.t}}; width: {{q.s}}; height: {{q.s}}; background: {{q.c}}; opacity: {{q.o}}; z-index: 940; pointer-events: none"></div>
</sc-for>

<!-- Ritmo: anillo que se cierra sobre el personaje -->
<sc-if value="{{rhythmOn}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: {{rtL}}; top: {{rtT}}; width: 44px; height: 44px; border-radius: 50%; border: 3px solid #e6dfc0; box-sizing: border-box; pointer-events: none; z-index: 950"></div>
<div style="position: absolute; left: {{rrL}}; top: {{rrT}}; width: {{rrS}}; height: {{rrS}}; border-radius: 50%; border: 3px solid #c9d97a; box-sizing: border-box; pointer-events: none; z-index: 950"></div>
<div style="position: absolute; left: {{rdL}}; top: {{rdT}}; display: flex; gap: 5px; pointer-events: none; z-index: 950">
<sc-for list="{{rhythmDots}}" as="d" hint-placeholder-count="4"><div style="width: 8px; height: 8px; background: {{d.bg}}; box-shadow: 0 0 0 2px #070705"></div></sc-for>
</div>
</sc-if>

<!-- Esquivar: dos flechas que titilan a los costados -->
<sc-if value="{{altOn}}" hint-placeholder-val="{{ false }}">
<svg class="chl" aria-hidden="true" style="position: absolute; left: {{alL}}; top: {{alT}}; pointer-events: none; z-index: 950; filter: drop-shadow(2px 2px 0 #070705)" width="21" height="27" viewBox="0 0 7 9" shape-rendering="crispEdges"><rect x="4" y="0" width="2" height="2" fill="#e6dfc0"></rect><rect x="2" y="2" width="2" height="2" fill="#e6dfc0"></rect><rect x="0" y="4" width="2" height="1" fill="#e6dfc0"></rect><rect x="2" y="5" width="2" height="2" fill="#e6dfc0"></rect><rect x="4" y="7" width="2" height="2" fill="#e6dfc0"></rect></svg>
<svg class="chr" aria-hidden="true" style="position: absolute; left: {{arL}}; top: {{alT}}; pointer-events: none; z-index: 950; transform: scaleX(-1); filter: drop-shadow(-2px 2px 0 #070705)" width="21" height="27" viewBox="0 0 7 9" shape-rendering="crispEdges"><rect x="4" y="0" width="2" height="2" fill="#e6dfc0"></rect><rect x="2" y="2" width="2" height="2" fill="#e6dfc0"></rect><rect x="0" y="4" width="2" height="1" fill="#e6dfc0"></rect><rect x="2" y="5" width="2" height="2" fill="#e6dfc0"></rect><rect x="4" y="7" width="2" height="2" fill="#e6dfc0"></rect></svg>
</sc-if>

<!-- Ícono de acción: chico de lejos, grande al llegar, se llena al mantener -->
<sc-if value="{{showBubble}}" hint-placeholder-val="{{ false }}">
<div class="float" style="position: absolute; left: {{bL}}; top: {{bT}}; pointer-events: none; z-index: 960">
<div style="display: flex; flex-direction: column; align-items: center; transform: scale({{bS}}); transform-origin: 50% 100%; opacity: {{bOp}}; transition: transform .2s ease-out, opacity .2s">
<div style="position: relative; width: 52px; height: 52px; background: #14150f; box-shadow: 0 0 0 3px {{bRing}}, 0 0 0 6px #070705, 0 0 20px rgba(232,179,58,{{bGlow}}); display: flex; align-items: center; justify-content: center">
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: {{holdPct}}; background: rgba(232,179,58,.55)"></div>
<sc-if value="{{iGrab}}" hint-placeholder-val="{{ false }}"><svg width="36" height="36" style="position: relative" viewBox="0 0 12 12" aria-hidden="true" shape-rendering="crispEdges"><rect x="3" y="1" width="7" height="4" fill="#e6dfc0"></rect><rect x="2" y="3" width="1" height="2" fill="#e6dfc0"></rect><rect x="3" y="5" width="1" height="2" fill="#e6dfc0"></rect><rect x="5" y="5" width="1" height="3" fill="#e6dfc0"></rect><rect x="7" y="5" width="1" height="3" fill="#e6dfc0"></rect><rect x="9" y="5" width="1" height="2" fill="#e6dfc0"></rect><rect x="3" y="9" width="7" height="2" fill="#d8d0b0"></rect></svg></sc-if>
<sc-if value="{{iDni}}" hint-placeholder-val="{{ false }}"><svg width="36" height="36" style="position: relative" viewBox="0 0 12 12" aria-hidden="true" shape-rendering="crispEdges"><rect x="1" y="3" width="10" height="7" fill="#d8d0b0"></rect><rect x="2" y="4" width="3" height="4" fill="#7d7a62"></rect><rect x="6" y="5" width="4" height="1" fill="#7d7a62"></rect><rect x="6" y="7" width="3" height="1" fill="#7d7a62"></rect></svg></sc-if>

<sc-if value="{{iAlarm}}" hint-placeholder-val="{{ false }}"><svg width="36" height="36" style="position: relative" viewBox="0 0 12 12" aria-hidden="true" shape-rendering="crispEdges"><rect x="3" y="3" width="6" height="7" fill="#e05a4a"></rect><rect x="4" y="2" width="4" height="1" fill="#e05a4a"></rect><rect x="2" y="10" width="8" height="1" fill="#bdb795"></rect><rect x="5" y="4" width="2" height="2" fill="#f4f0dc"></rect><rect x="1" y="2" width="1" height="1" fill="#f2c200"></rect><rect x="10" y="2" width="1" height="1" fill="#f2c200"></rect><rect x="0" y="5" width="1" height="1" fill="#f2c200"></rect><rect x="11" y="5" width="1" height="1" fill="#f2c200"></rect></svg></sc-if>

</div>

<!-- Viñeta y destellos -->

</div>
<div role="img" aria-label="{{routeLabel}}" style="display: flex; align-items: center; gap: 10px">

<script type="text/x-dc" data-dc-script data-props="{&quot;sound&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true},&quot;volume&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.35,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05},&quot;scanlines&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true},&quot;crowd&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:30,&quot;min&quot;:0,&quot;max&quot;:60},&quot;zoom&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:1.5,&quot;min&quot;:1,&quot;max&quot;:2,&quot;step&quot;:0.25},&quot;speed&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:230,&quot;min&quot;:100,&quot;max&quot;:360,&quot;unit&quot;:&quot;px/s&quot;},&quot;clockRate&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:5,&quot;min&quot;:1,&quot;max&quot;:20,&quot;step&quot;:1,&quot;unit&quot;:&quot;s de juego por s&quot;},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:720}}">

      { c: '#e05a4a', p: [[40, 90], [380, 90], [560, 60], [930, 60]] }, { c: '#9b6fc0', p: [[120, 480], [330, 300], [650, 300], [930, 430]] },
      { c: '#5aa37a', p: [[40, 380], [300, 380], [400, 440], [930, 440]] }, { c: '#2f7dbf', p: [[780, 30], [780, 490]] }
    ];
    this.reset();
  }

  /* ================= estado ================= */
  L(s, x) { return s * 1280 + x; }
  reset() {
    this.g = {
      x: 110, y: 470, face: 1, left: 600, ff: 0, helps: 0, ignores: 0, res: Array(10).fill(null), phase: 'intro', t: 0, hold: false, keys: {},
      alt: { last: null, n: 0, at: 0 }, moved: false, dist: 0, peekT: 0, peekKind: null, peeked: {}, notifQ: [], buzzT: 0, stopT: 0, warmT: 0, grayT: 0,
      flashAt: { x: 640, y: 360 }, parts: [], focus: 0, bumpT: 0, squashT: 0, beatT: 0, walkTo: null, stuckT: 0, mouseHold: false,
      trainX: 0, trainV: 0, trainT: 0, camX: 0, camY: 0, camInit: false, costT: 0, costTxt: '', stun: 0, slipT: 0, slips: 0, safeT: 0, shakeT: 0, mini: null, prog: 0,

      queued: false, cutT: 0, grumbleT: 0, gateWas: null, gateWasQ: null, sceneT: 0, glowT: 0, hopT: 0, hopI: -1, sadT: 0, sadI: -1, popT: 0, near: 0
    };

  }
  rng(seed) { let s = seed; return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }
  setupWorld() {
    const g = this.g, L = (s, x) => this.L(s, x), r = this.rng(17);
    g.dni = { x: L(0, 700), y: 640, vx: 60, vy: 30, rot: 0, kickT: 1, picked: false, ownerOn: false };
    g.ask = { y: 620, moving: false, contact: false };

    g.trash = { up: false };
    g.fight = { phase: 0, t: 0, ax: L(3, 880), bx: L(3, 930), y: 395, guard: null };
    g.vend = { kid: false, kidDone: false, kx: L(4, 650), ky: 672 };
    g.lift = { stage: 0, px: L(4, 1110), py: 345 };
    g.off = { x: L(4, 300), y: 520, tx: L(4, 300), ty: 520, wait: 1, face: 1, moving: false, stuck: false };
    g.sen = { x: L(5, 718) };

    g.guards = [{ x: L(5, 860), y: 560, face: -1 }, { x: L(6, 1060), y: 400, face: -1 }];

    g.puddles = [];
    for (let i = 0; i < 16; i++) g.puddles.push({ x: L(3, 160 + i * 24), y: 540 + Math.sin(i) * 6, t: 4 + i * 0.4 });
    g.queue = [0, 1, 2].map((k) => ({ row: Math.floor(r() * 12), x: L(5, 660) - k * 36, y: 654, state: 'wait', moving: false, ph: r() * 6 }));
    g.qSpawnT = 3;
    this.makeCrowd();
    this.makeHelpers();
  }
  makeCrowd() {
    const g = this.g, L = (s, x) => this.L(s, x), r = this.rng(97);
    const crowd = [];
    const idle = [[0, 1000, 340], [0, 1180, 460], [0, 250, 610], [0, 420, 345], [0, 860, 350],
      [1, 640, 330], [1, 460, 680], [1, 1180, 350], [2, 360, 345], [2, 200, 350], [2, 860, 345], [2, 300, 672],
      [3, 1000, 350], [3, 1150, 620], [4, 200, 350], [4, 520, 340], [4, 330, 350], [4, 1000, 360], [5, 300, 340], [5, 930, 360], [5, 1110, 560], [5, 160, 470], [5, 420, 350],
      [6, 100, 400], [6, 232, 385], [6, 496, 390], [6, 616, 430], [6, 742, 392], [6, 858, 415], [6, 985, 400], [6, 1198, 415], [6, 282, 515], [6, 928, 530], [6, 1140, 520]];
    idle.forEach((p) => crowd.push({ row: Math.floor(r() * 12), x: L(p[0], p[1]), y: p[2], vx: 0, idle: true, ph: r() * 6, phone: r() < 0.5, react: 0 }));
    // gente que filma la pelea con el celular
    crowd.push({ row: 3, x: L(3, 760), y: 430, vx: 0, idle: true, ph: 0, phone: true, rec: true, react: 0 });
    crowd.push({ row: 9, x: L(3, 1050), y: 440, vx: 0, idle: true, ph: 1, phone: true, rec: true, react: 0 });
    const n = this.props.crowd ?? 30;

      const zoneB = r() < 0.12;
      const x = zoneB ? L(5, 880) + r() * 1600 : r() * L(5, 460);
      crowd.push({ row: Math.floor(r() * 12), x, y: 330 + r() * 350, vx: (r() < 0.6 ? 1 : -1) * (55 + r() * 70), idle: false, ph: r() * 6, zone: zoneB ? 1 : 0, react: 0 });
    }
    g.crowd = crowd;
  }
  /* otros pasajeros que también se cruzan con quien necesita algo: miran, prueban... y siguen */
  makeHelpers() {
    const r = this.rng(53);
    const defs = [[0, 'look', 3], [1, 'look', 2], [2, 'shrug', 2], [3, 'listen', 1.5], [3, 'listen', 6, 1], [4, 'look', 2], [6, 'shrug', 2.5], [7, 'shrug', 2], [8, 'card', 1], [8, 'card', 6.5, 1], [8, 'card', 12, 2], [9, 'look', 3]];
    this.g.helpers = defs.map((d) => ({ ev: d[0], kind: d[1], o: d[3] || 0, row: Math.floor(r() * 12), x: 0, y: 0, state: 'wait', t: d[2], face: 1, tag: null, moving: false, did: false }));
  }

  /* ================= audio ================= */
  initAudio() {
    if (this.A !== undefined) return;
    this.A = null;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      const ctx = new AC();
      const master = ctx.createGain(); master.gain.value = this.masterVol(); master.connect(ctx.destination);
      const ambF = ctx.createBiquadFilter(); ambF.type = 'lowpass'; ambF.frequency.value = 16000; ambF.Q.value = 0.4;
      const ambG = ctx.createGain(); ambG.gain.value = 0; ambF.connect(ambG); ambG.connect(master);
      const fanG = ctx.createGain(); fanG.gain.value = 0; fanG.connect(ambF);
      const artF = ctx.createBiquadFilter(); artF.type = 'lowpass'; artF.frequency.value = 16000;
      const artP = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
      const artG = ctx.createGain(); artG.gain.value = 0;
      if (artP) { artF.connect(artP); artP.connect(artG); } else artF.connect(artG);
      artG.connect(master);
      const sfxG = ctx.createGain(); sfxG.gain.value = 1; sfxG.connect(master);
      const el = (src, dest) => { const a = new Audio(src); a.loop = true; a.preload = 'auto'; try { ctx.createMediaElementSource(a).connect(dest); } catch (e) { a.volume = 0.12; } return a; };
      const amb = el(this.SRC.ambiente, ambF);
      const fan = el(this.SRC.ventiladores, fanG);
      const art = el(this.SRC.artista, artF);
      this.A = { ctx, master, ambF, ambG, fanG, artF, artP, artG, sfxG, amb, fan, art, buf: {} };
      ['papel', 'puerta', 'timbre', 'tren'].forEach((n) => {
        fetch(this.SRC[n]).then((r) => r.arrayBuffer()).then((b) => new Promise((res, rej) => ctx.decodeAudioData(b, res, rej))).then((buf) => { this.A.buf[n] = buf; }).catch(() => {});
      });
    } catch (e) { this.A = null; }
  }
  masterVol() { return this.props.sound === false ? 0 : (this.props.volume ?? 0.35); }
  set(param, v, tc) { try { param.setTargetAtTime(v, this.A.ctx.currentTime, tc || 0.25); } catch (e) {} }
  sfx(n, o) {
    const A = this.A; if (!A || this.props.sound === false) return;
    o = o || {};
    const go = () => {
      const buf = A.buf[n]; if (!buf) return;
      try {
        const s = A.ctx.createBufferSource(); s.buffer = buf; s.playbackRate.value = o.rate || 1;
        const gn = A.ctx.createGain(); gn.gain.value = o.vol ?? 1;
        let node = gn;
        if (o.pan && A.ctx.createStereoPanner) { const p = A.ctx.createStereoPanner(); p.pan.value = o.pan; gn.connect(p); node = p; }
        s.connect(gn); node.connect(A.sfxG); s.start();
      } catch (e) {}
    };
    if (o.delay) setTimeout(go, o.delay); else go();
  }
  tone(type, f0, f1, dur, vol, filt) {
    const A = this.A; if (!A || this.props.sound === false) return;
    try {
      const ctx = A.ctx, t = ctx.currentTime;
      const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t);
      if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      const gn = ctx.createGain(); gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(vol, t + 0.012); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      let n = o;
      if (filt) { const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filt; o.connect(f); n = f; }
      n.connect(gn); gn.connect(A.sfxG); o.start(t); o.stop(t + dur + 0.05);
    } catch (e) {}
  }
  noise(dur, vol, f0, f1, type) {
    const A = this.A; if (!A || this.props.sound === false) return;
    try {
      const ctx = A.ctx, t = ctx.currentTime;
      const len = Math.floor(ctx.sampleRate * dur), b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const s = ctx.createBufferSource(); s.buffer = b;
      const f = ctx.createBiquadFilter(); f.type = type || 'bandpass'; f.Q.value = 1.2; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
      const gn = ctx.createGain(); gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(gn); gn.connect(A.sfxG); s.start(t);
    } catch (e) {}
  }
  note(f, t0, dur, vol, type, cut) {
    const A = this.A; if (!A || this.props.sound === false) return;
    try {
      const ctx = A.ctx, t = ctx.currentTime + t0;
      const o = ctx.createOscillator(); o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
      const fl = ctx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = cut || 2400;
      const gn = ctx.createGain(); gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(vol, t + 0.008); gn.gain.setValueAtTime(vol, t + dur * 0.6); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(fl); fl.connect(gn); gn.connect(A.sfxG); o.start(t); o.stop(t + dur + 0.05);
    } catch (e) {}
  }
  good() {
    const scale = [523.25, 587.33, 659.25, 698.46, 783.99, 880.0, 987.77, 1046.5, 1174.7, 1318.5];
    const root = scale[Math.min(9, Math.max(0, this.g.helps - 1))];
    [1, 1.25, 1.5].forEach((m, i) => this.note(root * m, i * 0.07, 0.11, 0.05, 'square', 2600));
    this.note(root * 2, 0.21, 0.42, 0.045, 'square', 2200);
    this.note(root / 2, 0, 0.5, 0.06, 'triangle', 1200);
  }
  bad() {
    this.note(311.13, 0, 0.16, 0.05, 'square', 900);
    this.note(233.08, 0.15, 0.34, 0.05, 'square', 700);
    this.note(116.54, 0.15, 0.4, 0.06, 'triangle', 500);
    this.noise(0.12, 0.06, 260, 120, 'lowpass');
