<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Final 2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; font-family: 'VT323', monospace; color: #e6dfc0; background: #0a0a07">
<img src="assets/img/tramo6.png" alt="Andén de la línea H lleno de gente esperando" style="position: absolute; inset: 0; width: 1280px; height: 720px; image-rendering: pixelated; filter: grayscale(.6) brightness(.38)">
<div style="position: absolute; inset: 0; background: rgba(60,8,6,.3)"></div>

<!-- En el camino: las 10 situaciones, sin frases -->
<div style="position: absolute; left: 28px; top: 96px; width: 440px; box-sizing: border-box; padding: 20px 18px 18px; background: rgba(14,15,10,.94); box-shadow: inset 0 0 0 2px #3b3d2c, inset 0 3px 0 0 #55574a, 0 8px 24px rgba(0,0,0,.5); display: flex; flex-direction: column; gap: 14px">
<span style="font-family: 'Silkscreen', monospace; font-size: 12px; letter-spacing: 3px; color: #8f8c72">LO QUE MOSTRASTE</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px">
<sc-for list="{{lines}}" as="ln" hint-placeholder-count="10">
<div style="display: flex; align-items: center; gap: 12px; opacity: {{ln.op}}">
<div style="position: relative; width: 38px; height: 38px; flex-shrink: 0; background: {{ln.bg}}; box-shadow: 0 0 0 3px #070705; display: flex; align-items: center; justify-content: center">
<div style="display: flex; filter: {{ln.f}}">
<sc-if value="{{ln.k0}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 12 12" shape-rendering="crispEdges"><rect x="1" y="3" width="10" height="7" fill="#d8d0b0"></rect><rect x="2" y="4" width="3" height="4" fill="#7d7a62"></rect><rect x="6" y="5" width="4" height="1" fill="#7d7a62"></rect></svg></sc-if>
<sc-if value="{{ln.k1}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 12 12" shape-rendering="crispEdges"><rect x="3" y="3" width="6" height="1" fill="#e6dfc0"></rect><rect x="1" y="4" width="2" height="1" fill="#e6dfc0"></rect><rect x="9" y="4" width="2" height="1" fill="#e6dfc0"></rect><rect x="0" y="5" width="1" height="2" fill="#e6dfc0"></rect><rect x="11" y="5" width="1" height="2" fill="#e6dfc0"></rect><rect x="1" y="7" width="2" height="1" fill="#e6dfc0"></rect><rect x="9" y="7" width="2" height="1" fill="#e6dfc0"></rect><rect x="3" y="8" width="6" height="1" fill="#e6dfc0"></rect><rect x="4" y="4" width="4" height="4" fill="#8ec8f0"></rect><rect x="5" y="5" width="2" height="2" fill="#10110c"></rect></svg></sc-if>
<sc-if value="{{ln.k2}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 12 12" shape-rendering="crispEdges"><rect x="1" y="1" width="10" height="7" fill="#e6dfc0"></rect><rect x="2" y="8" width="2" height="2" fill="#e6dfc0"></rect><rect x="2" y="3" width="3" height="3" fill="#3bb3e6"></rect><rect x="5" y="4" width="2" height="1" fill="#10110c"></rect><rect x="7" y="3" width="3" height="3" fill="#f2c200"></rect></svg></sc-if>
<sc-if value="{{ln.k3}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 12 12" shape-rendering="crispEdges"><rect x="4" y="1" width="6" height="2" fill="#c9d97a"></rect><rect x="4" y="3" width="1" height="5" fill="#c9d97a"></rect><rect x="9" y="3" width="1" height="4" fill="#c9d97a"></rect><rect x="2" y="7" width="3" height="3" fill="#c9d97a"></rect><rect x="7" y="6" width="3" height="3" fill="#c9d97a"></rect></svg></sc-if>
<sc-if value="{{ln.k4}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 12 12" shape-rendering="crispEdges"><rect x="1" y="3" width="10" height="2" fill="#d8a860"></rect><rect x="1" y="5" width="10" height="1" fill="#7fd18a"></rect><rect x="1" y="6" width="10" height="1" fill="#e05a4a"></rect><rect x="1" y="7" width="10" height="1" fill="#f2c200"></rect><rect x="1" y="8" width="10" height="2" fill="#d8a860"></rect></svg></sc-if>
<sc-if value="{{ln.k5}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 12 12" shape-rendering="crispEdges"><rect x="3" y="3" width="6" height="7" fill="#e05a4a"></rect><rect x="4" y="2" width="4" height="1" fill="#e05a4a"></rect><rect x="2" y="10" width="8" height="1" fill="#bdb795"></rect><rect x="5" y="4" width="2" height="2" fill="#f4f0dc"></rect></svg></sc-if>
<sc-if value="{{ln.k6}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 12 12" shape-rendering="crispEdges"><rect x="5" y="0" width="2" height="2" fill="#7fd18a"></rect><rect x="4" y="2" width="5" height="1" fill="#7fd18a"></rect><rect x="3" y="3" width="2" height="2" fill="#7fd18a"></rect><rect x="4" y="5" width="4" height="1" fill="#7fd18a"></rect><rect x="7" y="6" width="2" height="2" fill="#7fd18a"></rect><rect x="3" y="8" width="5" height="1" fill="#7fd18a"></rect><rect x="5" y="9" width="2" height="2" fill="#7fd18a"></rect></svg></sc-if>
<sc-if value="{{ln.k7}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 12 12" shape-rendering="crispEdges"><rect x="3" y="1" width="6" height="2" fill="#3a4a80"></rect><rect x="2" y="3" width="8" height="1" fill="#10110c"></rect><rect x="5" y="1" width="2" height="1" fill="#f2c200"></rect><rect x="4" y="4" width="4" height="3" fill="#d9a77a"></rect><rect x="3" y="7" width="6" height="4" fill="#3a4a80"></rect></svg></sc-if>
<sc-if value="{{ln.k8}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 12 12" shape-rendering="crispEdges"><rect x="1" y="3" width="10" height="7" fill="#2f7d6d"></rect><rect x="1" y="7" width="10" height="1" fill="#e8b33a"></rect><rect x="2" y="4" width="2" height="2" fill="#d8c27a"></rect></svg></sc-if>
<sc-if value="{{ln.k9}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 12 12" shape-rendering="crispEdges"><rect x="2" y="5" width="3" height="5" fill="#e6dfc0"></rect><rect x="5" y="3" width="1" height="6" fill="#e6dfc0"></rect><rect x="6" y="2" width="1" height="7" fill="#e6dfc0"></rect><rect x="7" y="3" width="1" height="6" fill="#e6dfc0"></rect><rect x="8" y="4" width="1" height="5" fill="#e6dfc0"></rect><rect x="3" y="10" width="5" height="1" fill="#e6dfc0"></rect></svg></sc-if>
</div>
<sc-if value="{{ln.help}}" hint-placeholder-val="{{ true }}"><div style="position: absolute; right: -7px; bottom: -7px; width: 16px; height: 16px; background: #e8b33a; box-shadow: 0 0 0 2px #070705; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="10" height="10" viewBox="0 0 10 10" shape-rendering="crispEdges"><rect x="1" y="5" width="2" height="2" fill="#10110c"></rect><rect x="3" y="7" width="2" height="2" fill="#10110c"></rect><rect x="5" y="5" width="2" height="2" fill="#10110c"></rect><rect x="7" y="3" width="2" height="2" fill="#10110c"></rect><rect x="8" y="1" width="2" height="2" fill="#10110c"></rect></svg></div></sc-if>
</div>
<span style="font-size: 21px; line-height: 1; color: {{ln.color}}; white-space: nowrap">{{ln.text}}</span>
</div>
</sc-for>
</div>
<sc-if value="{{slipOn}}" hint-placeholder-val="{{ false }}"><span style="font-size: 22px; color: #8ec8f0">{{slipTxt}}</span></sc-if>
<div style="height: 2px; background: #2c2d21"></div>
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 40px; line-height: .8; color: #e8b33a">{{count}}</span>
<span style="font-size: 30px; color: #e05a4a">{{total}}</span>
</div>
</div>

<div style="position: absolute; left: 480px; top: 40px; width: 320px; height: 640px; background: #1d1e18; border-radius: 30px; box-shadow: 0 0 0 4px #070705, 0 0 0 7px #3b3d2c, 12px 16px 0 0 rgba(0,0,0,.5); padding: 16px 14px; box-sizing: border-box">
<div style="height: 100%; background: #0d100c; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; align-items: center">

<div style="align-self: stretch; display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; font-size: 19px; color: #bdb795">
<span>08:58</span>
<div style="display: flex; align-items: center; gap: 8px">
<svg role="img" aria-label="Señal baja" width="18" height="12" viewBox="0 0 9 6" shape-rendering="crispEdges"><rect x="0" y="4" width="2" height="2" fill="#bdb795"></rect><rect x="3" y="2" width="2" height="4" fill="#bdb795"></rect><rect x="6" y="0" width="2" height="6" fill="#3b3d2c"></rect></svg>
<span>21%</span>
<svg role="img" aria-label="Batería 21 por ciento" width="28" height="16" viewBox="0 0 14 8" shape-rendering="crispEdges"><rect x="0" y="0" width="12" height="1" fill="#bdb795"></rect><rect x="0" y="7" width="12" height="1" fill="#bdb795"></rect><rect x="0" y="0" width="1" height="8" fill="#bdb795"></rect><rect x="11" y="0" width="1" height="8" fill="#bdb795"></rect><rect x="12" y="2" width="2" height="4" fill="#bdb795"></rect><rect x="2" y="2" width="2" height="4" fill="#e8b33a"></rect></svg>
</div>
</div>

<div style="display: flex; align-items: center; gap: 12px; margin-top: 26px">
<div style="width: 46px; height: 46px; border-radius: 50%; background: #f2c200; display: flex; align-items: center; justify-content: center; font-family: 'Silkscreen', monospace; font-weight: 700; font-size: 24px; color: #10110c">H</div>
<span style="font-family: 'Silkscreen', monospace; font-weight: 700; font-size: 20px; letter-spacing: 2px; color: #e6dfc0">LÍNEA H</span>
</div>

<svg role="img" aria-label="Alerta" style="margin-top: 34px" width="60" height="60" viewBox="0 0 12 12" shape-rendering="crispEdges"><rect x="5" y="1" width="2" height="1" fill="#e05a4a"></rect><rect x="4" y="2" width="4" height="2" fill="#e05a4a"></rect><rect x="3" y="4" width="6" height="2" fill="#e05a4a"></rect><rect x="2" y="6" width="8" height="2" fill="#e05a4a"></rect><rect x="1" y="8" width="10" height="2" fill="#e05a4a"></rect><rect x="5" y="4" width="2" height="3" fill="#10110c"></rect><rect x="5" y="8" width="2" height="1" fill="#10110c"></rect></svg>
<span class="blink" style="font-family: 'Silkscreen', monospace; font-weight: 700; font-size: 30px; letter-spacing: 1px; color: #e05a4a; margin-top: 14px">CANCELADO</span>
<span style="font-size: 24px; color: #bdb795; margin-top: 4px">por colisión</span>

<div role="img" aria-label="Lo que hiciste en las 10 situaciones" style="display: flex; gap: 5px; margin-top: 30px">
<sc-for list="{{res}}" as="r" hint-placeholder-count="10"><div style="width: 15px; height: 15px; background: {{r.bg}}; box-shadow: 0 0 0 3px #070705"></div></sc-for>
</div>

<div class="shake" style="align-self: stretch; margin: 28px 14px 0; background: #2a1210; border-radius: 10px; padding: 12px; display: flex; gap: 12px; align-items: center">
<div style="width: 38px; height: 38px; border-radius: 50%; background: #6b4a7a; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: 'Silkscreen', monospace; font-weight: 700; font-size: 14px; color: #f0e6f5">J</div>
<div style="display: flex; flex-direction: column; gap: 4px; flex: 1">
<span style="font-family: 'Silkscreen', monospace; font-size: 10px; letter-spacing: 1px; color: #bdb795">TU JEFE · AHORA</span>
<span style="font-size: 24px; line-height: 1; color: #e6dfc0">¿¡Dónde estás!?</span>
</div>
<svg role="img" aria-label="Emoji enojado" width="44" height="44" viewBox="0 0 12 12" shape-rendering="crispEdges"><rect x="4" y="1" width="4" height="1" fill="#e05a4a"></rect><rect x="2" y="2" width="8" height="1" fill="#e05a4a"></rect><rect x="1" y="3" width="10" height="6" fill="#e05a4a"></rect><rect x="2" y="9" width="8" height="1" fill="#e05a4a"></rect><rect x="4" y="10" width="4" height="1" fill="#e05a4a"></rect><rect x="3" y="4" width="2" height="1" fill="#10110c"></rect><rect x="5" y="5" width="1" height="1" fill="#10110c"></rect><rect x="7" y="4" width="2" height="1" fill="#10110c"></rect><rect x="6" y="5" width="1" height="1" fill="#10110c"></rect><rect x="4" y="6" width="1" height="1" fill="#10110c"></rect><rect x="7" y="6" width="1" height="1" fill="#10110c"></rect><rect x="4" y="8" width="4" height="1" fill="#10110c"></rect><rect x="3" y="9" width="1" height="1" fill="#10110c"></rect><rect x="8" y="9" width="1" height="1" fill="#10110c"></rect><rect x="1" y="1" width="1" height="1" fill="#e05a4a"></rect><rect x="10" y="1" width="1" height="1" fill="#e05a4a"></rect></svg>
</div>

</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"res":{"editor":null,"tsType":"string"},"slip":{"editor":null,"tsType":"string"},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const s = String(this.props.res || 'ihiihiiihi').padEnd(10, 'i').slice(0, 10).split('');
    const W = ['Honestidad', 'Atención', 'Paciencia', 'Sensibilidad', 'Empatía', 'Coraje', 'Solidaridad', 'Compromiso', 'Generosidad', 'Cuidado'];
    const n = s.filter((c) => c === 'h').length;
    const slips = parseInt(this.props.slip || '0', 10) || 0;
    const sec = slips * 30;
    return {
      res: s.map((c) => ({ bg: c === 'h' ? '#e8b33a' : '#4a4936' })),
      lines: s.map((c, i) => Object.assign({ help: c === 'h', text: W[i], bg: c === 'h' ? '#2a2a1c' : '#16170f', color: c === 'h' ? '#e6dfc0' : '#6b6a55', op: c === 'h' ? '1' : '.8', f: c === 'h' ? 'none' : 'grayscale(1) brightness(.6)' }, Object.fromEntries(W.map((_, k) => ['k' + k, k === i])))),
      count: n + ' / 10', total: n ? '-' + (n * 2) + ':00' : '0:00',
      slipOn: slips > 0, slipTxt: 'Resbalones: ' + slips + ' · -' + Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0')
    };
  }
}
</script>
</body>
</html>
