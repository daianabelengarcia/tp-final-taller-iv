<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combinación · un viaje en subte</title>
<meta name="description" content="Un juego sin palabras: tenés 10 minutos para combinar de la línea A a la H y llegar al trabajo. En el camino, alguien siempre necesita ayuda.">
<meta property="og:title" content="Combinación · un viaje en subte">
<meta property="og:description" content="Un juego sin palabras sobre el tiempo, el apuro y la gente que pasa al lado.">
<meta property="og:image" content="assets/img/portada.png">
<link rel="icon" href="assets/img/icono.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#070705;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:50% 50%;overflow:hidden;background:#0a0a07}
x-frag{display:contents}
.title{position:absolute;inset:0;cursor:pointer;font-family:'VT323',monospace;color:#e6dfc0}
.title:focus{outline:none}
.logo{font-family:'Silkscreen',monospace;font-weight:700;font-size:54px;line-height:1.3;letter-spacing:2px;color:#f2c200;text-shadow:4px 4px 0 #070705}
.tagline{font-size:26px;line-height:1.05;color:#bdb795;max-width:340px}
.badge{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Silkscreen',monospace;font-weight:700;font-size:18px;color:#10110c;box-shadow:0 0 0 3px #070705}
.prompt{animation:jugarPulse 1.4s infinite steps(2)}
@keyframes jugarPulse{0%{opacity:1}100%{opacity:.35}}
.key{background:#e6dfc0;color:#10110c;box-shadow:0 0 0 3px #070705;display:flex;align-items:flex-end;justify-content:center;box-sizing:border-box}
.mute{all:unset;cursor:pointer;position:absolute;left:28px;bottom:24px;width:46px;height:46px;display:flex;align-items:center;justify-content:center;background:rgba(14,15,10,.9);box-shadow:3px 0 0 0 #3b3d2c,-3px 0 0 0 #3b3d2c,0 3px 0 0 #3b3d2c,0 -3px 0 0 #3b3d2c;z-index:5000}
.mute:focus-visible{box-shadow:3px 0 0 0 #e8b33a,-3px 0 0 0 #e8b33a,0 3px 0 0 #e8b33a,0 -3px 0 0 #e8b33a}
.credit{position:absolute;right:28px;bottom:20px;font-size:18px;color:#6b6a55}
</style>
</head>
<body>
<div id="stage" aria-label="Combinación, un juego en el subte"></div>
<noscript><p style="color:#e6dfc0;font-family:monospace;padding:24px">Este juego necesita JavaScript.</p></noscript>
<script type="module" src="main.js"></script>
</body>
</html>
